<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>
</head>
<body>
    <marquee behavior="scroll" direction="left">Welcome to the Registration Page</marquee>

    <form action="https://httpbin.org/post" method="POST">
    <input name="text" type="text" placeholder="Enter your name"> <br> <br>
    <input name="email" type="email" placeholder="Enter your email"> <br> <br>
    <input name="password" type="password" placeholder="Enter your password"> <br> <br>
    <input name="age" type="number"  placeholder="Enter your age"> <br> <br>
    <input name="gender" type="radio" name="gender" value="male"> Male
    <input  name="gender" type="radio" name="gender" value="female"> Female <br> <br>
    <input  name="terms" type="checkbox" name="terms"> I agree to the terms and conditions <br> <br>
    <input name="submit" type="submit" value="Register"> 
    <input name="reset" type="reset" value="Reset"> 

    </form>
</body>
</html>
